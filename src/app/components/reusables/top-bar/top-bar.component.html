<header class="topbar">
  <div class="container-fluid">
    <div class="navbar-header">

      <div class="d-flex align-items-center gap-2">
        <!-- Espace réservé pour un titre ou un logo -->
      </div>

      <div class="d-flex align-items-center gap-1">

        <!-- Thème clair / sombre -->
        <div class="topbar-item">
          <button type="button" class="topbar-button" id="light-dark-mode" (click)="changeTheme()">
            <iconify-icon icon="solar:moon-broken" class="fs-24 align-middle light-mode"></iconify-icon>
            <iconify-icon icon="solar:sun-broken" class="fs-24 align-middle dark-mode"></iconify-icon>
          </button>
        </div>

        <!-- Notifications -->
        @if (notifications) {
        <div ngbDropdown class="dropdown topbar-item">

          <button ngbDropdownToggle type="button" class="topbar-button position-relative arrow-none"
            id="page-header-notifications-dropdown" aria-haspopup="true" aria-expanded="false">

            <iconify-icon icon="solar:bell-bing-broken" class="fs-24 align-middle"></iconify-icon>

            @if(notifications.length>0){
            <span class="position-absolute topbar-badge fs-10 translate-middle badge bg-danger rounded-pill">
              {{ notifications.length }}
              <span class="visually-hidden">notifications non lues</span>
            </span>
            }

          </button>

          <div ngbDropdownMenu class="dropdown-menu py-0 dropdown-lg dropdown-menu-end"
            aria-labelledby="page-header-notifications-dropdown">

            <div class="p-3 border-top-0 border-start-0 border-end-0 border-dashed border">
              <div class="row align-items-center">
                <div class="col">
                  <h6 class="m-0 fs-16 fw-semibold">
                    Notifications
                  </h6>
                </div>
              </div>
            </div>

            <ngx-simplebar style="max-height: 280px;">

              @for (notify of notifications; track $index) {
              <a href="javascript:void(0);" class="dropdown-item py-3 border-bottom text-wrap">

                <div class="d-flex">

                  <div class="flex-grow-1">

                    <p class="mb-1">
                      <span class="fw-medium">
                        {{ notify.title }}
                      </span>
                    </p>

                    <p class="mb-0 text-wrap text-muted">
                      {{ notify.message }}
                    </p>

                  </div>

                </div>

              </a>
              }

            </ngx-simplebar>

            <div class="text-center py-3">
              <a href="javascript:void(0);" class="btn btn-primary btn-sm">
                Voir toutes les notifications
                <i class="bx bx-right-arrow-alt ms-1"></i>
              </a>
            </div>

          </div>

        </div>
        }

        <!-- Utilisateur -->
        <div ngbDropdown class="topbar-item">

          <a type="button" ngbDropdownToggle class="topbar-button arrow-none" id="page-header-user-dropdown"
            aria-haspopup="true" aria-expanded="false">

            <span class="d-flex align-items-center">
              <img class="rounded-circle" width="32" src="assets/images/new.jpg" alt="Photo de profil">
            </span>

          </a>

          <div ngbDropdownMenu class="dropdown-menu dropdown-menu-end">

            <h6 class="dropdown-header">
              Bonjour {{ user.fullname }} !
            </h6>

            @if(user.role.name!='ADMIN'){
            <a class="dropdown-item" [routerLink]="['/', user.role.name.toLowerCase(), 'chat']">
              <i class="bx bx-message-dots text-muted fs-18 align-middle me-1"></i>
              <span class="align-middle">Messagerie</span>
            </a>
            }

            <div class="dropdown-divider my-1"></div>

            <a class="dropdown-item text-danger" role="button" (click)="logout()">
              <i class="bx bx-log-out fs-18 align-middle me-1"></i>
              <span class="align-middle">Se déconnecter</span>
            </a>

          </div>

        </div>

      </div>

    </div>
  </div>
</header>
